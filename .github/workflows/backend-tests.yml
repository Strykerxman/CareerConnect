name: Backend tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
